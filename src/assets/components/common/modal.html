<!-- @component 모달
     @category common
     @variant  default — 중앙 정렬 다이얼로그
     @variant  fullscreen — MO 전체 화면 다이얼로그
     @variant  bottom-sheet — MO 하단 바텀시트
     @a11y     포커스 트랩, Esc·닫기 버튼·backdrop 닫기, 트리거 포커스 복귀
     @snippet  modal
-->
<section class="modal-showcase" aria-labelledby="modal-showcase-title">
  <h2 id="modal-showcase-title">모달</h2>
  <p>버튼으로 각 모달 변형을 열어 키보드 동작과 포커스 순환을 확인합니다.</p>
  <div class="modal-showcase__triggers">
    <button type="button" class="btn btn--primary btn--md" data-modal-open="modal-default">
      기본 모달 열기
    </button>
    <button type="button" class="btn btn--outline btn--md" data-modal-open="modal-fullscreen">
      풀스크린 모달 열기
    </button>
    <button type="button" class="btn btn--outline btn--md" data-modal-open="modal-bottom-sheet">
      바텀시트 열기
    </button>
  </div>

  <!-- @variant default -->
  <div
    id="modal-default"
    class="modal modal--default"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-default-title"
    aria-describedby="modal-default-description"
    data-modal="modal-default"
    tabindex="-1"
    hidden
  >
    <div class="modal__dialog">
      <header class="modal__header">
        <h3 id="modal-default-title" class="modal__title">기본 모달</h3>
        <button type="button" class="modal__close" data-modal-close aria-label="닫기">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      </header>
      <div class="modal__body">
        <p id="modal-default-description">
          중요한 선택이나 확인이 필요할 때 사용하는 중앙 정렬 다이얼로그입니다.
        </p>
      </div>
      <footer class="modal__actions">
        <button type="button" class="btn btn--outline btn--md" data-modal-close>취소</button>
        <button
          type="button"
          class="btn btn--outline btn--md"
          data-modal-open="modal-bottom-sheet"
        >
          바텀시트 추가 열기
        </button>
        <button type="button" class="btn btn--primary btn--md">확인</button>
      </footer>
    </div>
  </div>
  <!-- @endvariant -->

  <!-- @variant fullscreen -->
  <div
    id="modal-fullscreen"
    class="modal modal--fullscreen"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-fullscreen-title"
    aria-describedby="modal-fullscreen-description"
    data-modal="modal-fullscreen"
    tabindex="-1"
    hidden
  >
    <div class="modal__dialog">
      <header class="modal__header">
        <h3 id="modal-fullscreen-title" class="modal__title">풀스크린 모달</h3>
        <button type="button" class="modal__close" data-modal-close aria-label="닫기">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      </header>
      <div class="modal__body">
        <p id="modal-fullscreen-description">
          모바일에서 화면 전체를 사용해야 하는 긴 작업 흐름에 적합합니다.
        </p>
      </div>
      <footer class="modal__actions">
        <button type="button" class="btn btn--outline btn--md" data-modal-close>취소</button>
        <button type="button" class="btn btn--primary btn--md">저장</button>
      </footer>
    </div>
  </div>
  <!-- @endvariant -->

  <!-- @variant bottom-sheet -->
  <div
    id="modal-bottom-sheet"
    class="modal modal--bottom-sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-bottom-sheet-title"
    aria-describedby="modal-bottom-sheet-description"
    data-modal="modal-bottom-sheet"
    tabindex="-1"
    hidden
  >
    <div class="modal__dialog">
      <header class="modal__header">
        <h3 id="modal-bottom-sheet-title" class="modal__title">바텀시트</h3>
        <button type="button" class="modal__close" data-modal-close aria-label="닫기">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      </header>
      <div class="modal__body">
        <p id="modal-bottom-sheet-description">
          모바일에서 현재 맥락을 유지한 채 간단한 선택지를 제공할 때 사용합니다.
        </p>
      </div>
      <footer class="modal__actions">
        <button type="button" class="btn btn--outline btn--md" data-modal-close>나중에</button>
        <button type="button" class="btn btn--primary btn--md">선택</button>
      </footer>
    </div>
  </div>
  <!-- @endvariant -->
</section>
