<!-- @component 토스트
     @category common
     @variant  default — 일반 안내
     @variant  success — 작업 성공
     @variant  error — 오류 경고
     @a11y     기본·성공은 polite status, 오류는 assertive alert. 자동 닫힘 최소 5초
     @snippet  toast
-->
<section class="toast-showcase" aria-labelledby="toast-showcase-title">
  <h2 id="toast-showcase-title">토스트</h2>
  <p>일시적 알림은 사용자가 읽을 수 있도록 최소 5초 동안 유지합니다.</p>
  <div class="toast-showcase__list">
    <div
      class="toast toast--default is-visible"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      data-toast-duration="5000"
    >
      <p class="toast__message">장바구니에 상품을 담았습니다.</p>
    </div>
    <div
      class="toast toast--success is-visible"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      data-toast-duration="5000"
    >
      <p class="toast__message">주문 정보가 저장되었습니다.</p>
    </div>
    <div
      class="toast toast--error is-visible"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      data-toast-duration="5000"
    >
      <p class="toast__message">요청을 처리하지 못했습니다. 다시 시도해 주세요.</p>
    </div>
  </div>
</section>
