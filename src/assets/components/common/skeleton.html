<!-- @component 스켈레톤
     @category common
     @variant  text | image | product-card
     @a11y     aria-hidden="true"로 보조기술에서 제외. 실제 콘텐츠와 같은 크기로 맞춰 CLS 방지
     @snippet  skeleton
-->
<section class="skeleton-showcase" aria-labelledby="skeleton-showcase-title">
  <h2 id="skeleton-showcase-title">스켈레톤</h2>

  <div class="skeleton-showcase__section">
    <h3>텍스트 줄</h3>
    <div class="skeleton-text" aria-hidden="true">
      <span class="skeleton skeleton--text"></span>
      <span class="skeleton skeleton--text skeleton--text-short"></span>
    </div>
  </div>

  <div class="skeleton-showcase__section">
    <h3>이미지 블록</h3>
    <div class="skeleton skeleton--image" aria-hidden="true"></div>
  </div>

  <div class="skeleton-showcase__section">
    <h3>상품카드</h3>
    <article class="skeleton-product-card" aria-hidden="true">
      <div class="skeleton skeleton--image"></div>
      <div class="skeleton-product-card__content">
        <span class="skeleton skeleton--text"></span>
        <span class="skeleton skeleton--text skeleton--text-short"></span>
        <span class="skeleton skeleton--price"></span>
      </div>
    </article>
  </div>
</section>
