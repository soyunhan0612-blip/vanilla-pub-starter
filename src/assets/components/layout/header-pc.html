<!-- @component PC 헤더
     @category layout
     @variant  default — 유틸리티·검색·사용자 메뉴·GNB
     @a11y     검색 레이블, 장바구니·찜 개수 대체 텍스트, 이름이 있는 내비게이션 제공
     @snippet  header-pc
-->
<header class="site-header site-header--pc">
  <div class="site-header__utility">
    <div class="container">
      <nav aria-label="유틸리티">
        <ul class="site-header__utility-list">
          <li><a href="/login">로그인</a></li>
          <li><a href="/join">회원가입</a></li>
          <li><a href="/orders">주문조회</a></li>
          <li><a href="/support">고객센터</a></li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="site-header__main">
    <div class="container site-header__main-inner">
      <a class="site-header__logo" href="/" aria-label="쇼핑몰 홈">SHOP</a>

      <form class="site-search" role="search" action="/search" method="get">
        <label class="sr-only" for="site-search-pc">상품 검색</label>
        <input
          class="site-search__input"
          id="site-search-pc"
          name="query"
          type="search"
          placeholder="검색어를 입력하세요"
        >
        <button class="site-search__submit" type="submit" aria-label="검색">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      </form>

      <nav class="site-header__user-nav" aria-label="사용자 메뉴">
        <ul class="site-header__user-list">
          <li>
            <a class="site-header__icon-link" href="/wishlist">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" fill="none" stroke="currentColor" stroke-width="1.5" />
              </svg>
              <span class="site-header__badge" aria-hidden="true" data-bind="wishlist-count">2</span>
              <span class="sr-only">찜한 상품 2개</span>
            </a>
          </li>
          <li>
            <a class="site-header__icon-link" href="/cart">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20 8H7" fill="none" stroke="currentColor" stroke-width="1.5" />
                <circle cx="10" cy="20" r="1" fill="currentColor" />
                <circle cx="18" cy="20" r="1" fill="currentColor" />
              </svg>
              <span class="site-header__badge" aria-hidden="true" data-bind="cart-count">3</span>
              <span class="sr-only">장바구니 3개</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <!-- @include layout/gnb-pc.html -->
</header>
